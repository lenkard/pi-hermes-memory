# Local administration and container health checks.
local   all         all                                 trust

# Docker DNAT presents same-host bridge clients through the database network gateway.
host    pi_memory   pi_memory   172.30.54.1/32          scram-sha-256

# Deny every other TCP client. Remote VPN access requires an explicit reviewed rule.
host    all         all         0.0.0.0/0               reject
host    all         all         ::/0                    reject
